name: v5.1 Candidate CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "integration/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13.14"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"

jobs:
  source-quality:
    name: Source quality and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
            requirements-quality.txt

      - name: Generate native target matrix
        id: matrix
        shell: bash
        run: echo "matrix=$(python -m build_support.ci_matrix)" >> "$GITHUB_OUTPUT"

      - name: Install Linux GUI runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3-tk xvfb

      - name: Install constrained dependencies
        run: >-
          python -m pip install
          -r requirements.txt
          -r requirements-build.txt
          -r requirements-quality.txt

      - name: Run fail-fast source quality gate
        run: xvfb-run -a python -m build_support.quality --skip-build

      - name: Upload source coverage data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: source-quality-coverage
          path: .coverage
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  candidate-build:
    name: Build ${{ matrix.target }}
    needs: source-quality
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.source-quality.outputs.matrix) }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
            requirements-quality.txt

      - name: Install Linux GUI runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3-tk xvfb

      - name: Install constrained dependencies
        run: >-
          python -m pip install
          -r requirements.txt
          -r requirements-build.txt
          -r requirements-quality.txt

      - name: Report native runtime
        run: >-
          python -c
          "import platform, sys, tkinter;
          print(sys.version);
          print(platform.platform(), platform.machine());
          print('Tk', tkinter.TkVersion)"

      - name: Test, build, smoke-test, and verify candidate on Linux
        if: runner.os == 'Linux'
        run: >-
          xvfb-run -a python -m build_support.quality
          --target ${{ matrix.target }}
          --skip-static
          --skip-security

      - name: Test, build, smoke-test, and verify candidate on Windows or macOS
        if: runner.os != 'Linux'
        run: >-
          python -m build_support.quality
          --target ${{ matrix.target }}
          --skip-static
          --skip-security

      - name: Upload verified candidate
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            artifacts/${{ matrix.artifact_name }}
            artifacts/${{ matrix.artifact_name }}.sha256
            artifacts/${{ matrix.target }}-smoke.json
            artifacts/${{ matrix.target }}-verification.json
          if-no-files-found: error
          retention-days: 30
