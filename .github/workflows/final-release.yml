name: Final Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Stable release tag, for example v5.1.0
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: final-release-${{ github.repository }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.13.14"

jobs:
  publish-verified-release:
    name: Publish complete verified release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve requested tag
        id: requested
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout tagged source
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.requested.outputs.tag }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Validate tag and manifest identity
        id: identity
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.requested.outputs.tag }}
        run: |
          set -euo pipefail
          revision="$(git rev-parse HEAD)"
          python - "$RELEASE_TAG" <<'PY'
          import sys
          from build_support.release_gate import validate_release_tag
          validate_release_tag(sys.argv[1])
          PY
          version="$(python -c 'from product_identity import PRODUCT_VERSION; print(PRODUCT_VERSION)')"
          product="$(python -c 'from product_identity import PRODUCT_DISPLAY_NAME; print(PRODUCT_DISPLAY_NAME)')"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "product=$product" >> "$GITHUB_OUTPUT"

      - name: Locate successful same-revision Candidate CI run
        id: candidate
        shell: bash
        env:
          REVISION: ${{ steps.identity.outputs.revision }}
        run: |
          set -euo pipefail
          gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/smart-cicd.yml/runs" \
            -f head_sha="$REVISION" \
            -f status=success \
            -f event=push \
            -f per_page=100 > candidate-runs.json
          run_id="$(jq -r --arg revision "$REVISION" --arg repository "$GITHUB_REPOSITORY" \
            '[.workflow_runs[] | select(.head_sha == $revision and .conclusion == "success" and .event == "push" and .head_repository.full_name == $repository)] | sort_by(.created_at) | last | .id // empty' \
            candidate-runs.json)"
          if [[ -z "$run_id" ]]; then
            echo "No successful Candidate CI run exists for source revision $REVISION" >&2
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download every native candidate evidence set
        shell: bash
        env:
          RUN_ID: ${{ steps.candidate.outputs.run_id }}
        run: |
          set -euo pipefail
          mapfile -t targets < <(python -m build_support.release_gate --print-targets)
          download_args=()
          for target in "${targets[@]}"; do
            download_args+=(--name "$target")
          done
          gh run download "$RUN_ID" "${download_args[@]}" --dir release-input

      - name: Require complete verified same-revision artifacts
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.requested.outputs.tag }}
          REVISION: ${{ steps.identity.outputs.revision }}
        run: |
          set -euo pipefail
          python -m build_support.release_gate \
            --artifacts-dir release-input \
            --expected-revision "$REVISION" \
            --expected-tag "$RELEASE_TAG" \
            --output release-input/release-manifest.json

      - name: Refuse to replace an existing release
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.requested.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to replace it" >&2
            exit 1
          fi

      - name: Publish verified release assets
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.requested.outputs.tag }}
          PRODUCT: ${{ steps.identity.outputs.product }}
          VERSION: ${{ steps.identity.outputs.version }}
          REVISION: ${{ steps.identity.outputs.revision }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          ## $PRODUCT $VERSION

          Native packages for Windows x64, Linux x64, macOS Apple Silicon,
          and macOS Intel were built and frozen-smoke-tested by Candidate CI.

          Source revision: \`$REVISION\`

          Checksums, smoke reports, verification reports, and the consolidated
          release manifest are attached with the packages.
          EOF
          mapfile -t assets < <(find release-input -type f -print | sort)
          if [[ "${#assets[@]}" -eq 0 ]]; then
            echo "No validated release assets were found" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" "${assets[@]}" \
            --verify-tag \
            --title "$PRODUCT $VERSION" \
            --notes-file release-notes.md
